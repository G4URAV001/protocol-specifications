name: Validate OpenAPI Specifications

on:
  pull_request:
    branches: [ master, draft ]
    paths:
      - 'api/transaction/build/transaction.yaml'
      - 'api/meta/build/meta.yaml'
      - 'api/registry/build/registry.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install OpenAPI validator
        run: npm install -g @apidevtools/swagger-cli
      
      - name: Validate transaction.yaml
        run: swagger-cli validate api/transaction/build/transaction.yaml
      
      - name: Validate meta.yaml
        run: swagger-cli validate api/meta/build/meta.yaml
      
      - name: Validate registry.yaml
        run: swagger-cli validate api/registry/build/registry.yaml 